<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tap Fishing</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="ゲーム情報">
        <div>
          <span class="label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">TIME</span>
          <strong id="time">60</strong>
        </div>
        <div class="version">
          <span class="label">VERSION</span>
          <strong id="version">...</strong>
        </div>
        <button id="resetButton" type="button" aria-label="ゲームをリセット">↻</button>
      </section>

      <canvas id="gameCanvas" aria-label="魚釣りゲーム画面"></canvas>

      <section class="status" aria-live="polite">
        <p id="message">タップで浮きを投げよう</p>
        <button id="actionButton" type="button">投げる</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
