<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tap Fishing</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="ゲーム情報">
        <div>
          <span class="label">MONEY</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">CAUGHT</span>
          <strong id="caught">0</strong>
        </div>
        <div class="version">
          <span class="label">VERSION</span>
          <strong id="version">...</strong>
        </div>
        <button id="resetButton" type="button" aria-label="ゲームをリセット">↻</button>
      </section>

      <canvas id="gameCanvas" aria-label="魚釣りゲーム画面"></canvas>

      <section class="status" aria-live="polite">
        <p id="message">タップで浮きを投げよう</p>
        <button id="actionButton" type="button">投げる</button>
      </section>

      <nav class="menu-bar" aria-label="メニュー">
        <button id="playTab" class="tab-button is-active" type="button">釣る</button>
        <button id="dexTab" class="tab-button" type="button">図鑑</button>
        <button id="shopTab" class="tab-button" type="button">店</button>
      </nav>

      <section id="menuScreen" class="screen" aria-label="メニュー画面">
        <div class="menu-panel">
          <h1>Tap Fishing</h1>
          <button id="startButton" class="primary-button" type="button">釣りを始める</button>
          <button id="menuShopButton" class="secondary-button" type="button">店</button>
          <button id="menuDexButton" class="secondary-button" type="button">図鑑</button>
        </div>
      </section>

      <section id="dexScreen" class="screen is-hidden" aria-label="図鑑">
        <div class="dex-panel">
          <header class="dex-header">
            <h2>図鑑</h2>
            <button id="closeDexButton" type="button">戻る</button>
          </header>
          <div id="dexList" class="dex-list"></div>
        </div>
      </section>

      <section id="shopScreen" class="screen is-hidden" aria-label="ショップ">
        <div class="shop-panel">
          <header class="shop-header">
            <div>
              <h2>店</h2>
              <p id="shopMoney">0円</p>
            </div>
            <button id="closeShopButton" type="button">戻る</button>
          </header>
          <div id="shopList" class="shop-list"></div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
