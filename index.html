<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tap Fishing</title>
    <link rel="stylesheet" href="style.css?v=2.1.1">
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="ゲーム情報">
        <div>
          <span class="label">MONEY</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">CAUGHT</span>
          <strong id="caught">0</strong>
        </div>
        <div class="version">
          <span class="label">VERSION</span>
          <strong id="version">...</strong>
        </div>
        <button id="musicToggleButton" type="button" aria-label="BGMのオンオフ">BGM ON</button>
        <button id="resetButton" type="button" aria-label="ゲームをリセット">↻</button>
      </section>

      <canvas id="gameCanvas" aria-label="魚釣りゲーム画面"></canvas>

      <section class="status" aria-live="polite">
        <div>
          <p id="message">タップで浮きを投げよう</p>
          <small id="missionSummary">ミッション準備中</small>
        </div>
        <button id="actionButton" type="button">投げる</button>
      </section>

      <nav class="menu-bar" aria-label="メニュー">
        <button id="playTab" class="tab-button is-active" type="button">釣る</button>
        <button id="missionTab" class="tab-button" type="button">任務</button>
        <button id="spotTab" class="tab-button" type="button">場所</button>
        <button id="dexTab" class="tab-button" type="button">図鑑</button>
        <button id="shopTab" class="tab-button" type="button">店</button>
        <button id="reloadButton" class="tab-button" type="button">更新</button>
      </nav>

      <section id="menuScreen" class="screen" aria-label="メニュー画面">
        <div class="menu-panel">
          <h1>Tap Fishing</h1>
          <button id="startButton" class="primary-button" type="button">釣りを始める</button>
          <button id="menuMissionButton" class="secondary-button" type="button">任務</button>
          <button id="menuSpotButton" class="secondary-button" type="button">釣り場</button>
          <button id="menuReloadButton" class="secondary-button" type="button">最新版を読み込む</button>
          <button id="menuShopButton" class="secondary-button" type="button">店</button>
          <button id="menuDexButton" class="secondary-button" type="button">図鑑</button>
          <button id="fullResetButton" class="danger-button" type="button">はじめから</button>
        </div>
      </section>

      <section id="missionScreen" class="screen is-hidden" aria-label="ミッション">
        <div class="mission-panel">
          <header class="mission-header">
            <div>
              <h2>任務</h2>
              <p id="missionCount">0 / 0 完了</p>
            </div>
            <button id="closeMissionButton" type="button">戻る</button>
          </header>
          <div id="missionList" class="mission-list"></div>
        </div>
      </section>

      <section id="dexScreen" class="screen is-hidden" aria-label="図鑑">
        <div class="dex-panel">
          <header class="dex-header">
            <h2>図鑑</h2>
            <button id="closeDexButton" type="button">戻る</button>
          </header>
          <div id="dexList" class="dex-list"></div>
          <section id="dexDetail" class="dex-detail is-hidden" aria-label="魚の解説">
            <button id="closeDexDetailButton" class="dex-detail-close" type="button" aria-label="解説を閉じる">戻る</button>
            <div class="dex-detail-card">
              <div class="dex-detail-top">
                <div id="dexDetailArt" class="dex-detail-art"></div>
                <div class="dex-detail-summary">
                  <div class="dex-detail-doctor">
                    <span class="doctor-mark">博</span>
                    <div>
                      <strong>おさかな博士</strong>
                      <p id="dexDetailLead">調査中じゃ。</p>
                    </div>
                  </div>
                  <div class="dex-detail-head">
                    <span id="dexDetailRarity" class="dex-rarity">C</span>
                    <h3 id="dexDetailName">???</h3>
                    <p id="dexDetailMeta">未発見</p>
                  </div>
                  <div class="dex-detail-facts">
                    <div class="dex-fact">
                      <span class="dex-fact-label">おすすめ</span>
                      <strong id="dexDetailSpot">不明</strong>
                    </div>
                    <div class="dex-fact">
                      <span class="dex-fact-label">サイズ傾向</span>
                      <strong id="dexDetailTrend">調査中</strong>
                    </div>
                  </div>
                  <div id="dexDetailSizes" class="dex-sizes"></div>
                </div>
              </div>
              <p id="dexDetailText" class="dex-detail-text">まだ詳しい資料がそろっておらんようじゃ。</p>
            </div>
          </section>
        </div>
      </section>

      <section id="shopScreen" class="screen is-hidden" aria-label="ショップ">
        <div class="shop-panel">
          <header class="shop-header">
            <div>
              <h2>店</h2>
              <p id="shopMoney">0円</p>
            </div>
            <button id="closeShopButton" type="button">戻る</button>
          </header>
          <div id="shopList" class="shop-list"></div>
        </div>
      </section>

      <section id="spotScreen" class="screen is-hidden" aria-label="釣り場">
        <div class="spot-panel">
          <header class="spot-header">
            <h2>釣り場</h2>
            <button id="closeSpotButton" type="button">戻る</button>
          </header>
          <div id="spotList" class="spot-list"></div>
        </div>
      </section>
    </main>

    <script src="game-config.js?v=2.1.1"></script>
    <script src="game.js?v=2.1.1"></script>
  </body>
</html>
